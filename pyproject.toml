[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal"
version = "0.1.0"
description = "Domain-Native Indonesian Legal GraphRAG Platform"
requires-python = ">=3.12"

dependencies = [
    # Web Framework
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "gunicorn==23.0.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "python-multipart==0.0.20",

    # Database & ORM
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",

    # Task Queue & Cache
    "celery==5.4.0",
    "redis==5.2.1",

    # HTTP & Async
    "httpx==0.28.1",
    "anyio==4.7.0",
    "tenacity==9.0.0",

    # ML / AI Stack
    "docling==2.14.0",
    "transformers>=4.47.1",
    "torch==2.5.1",
    "huggingface-hub==0.27.0",
    "langfuse==2.57.4",
    "langgraph==0.2.60",
    "langchain-core==0.3.28",

    # Storage & Search
    "weaviate-client==4.10.2",
    "neo4j==5.27.0",
    "aiobotocore>=2.15.2",
    "boto3>=1.35.85",

    # Utilities
    "python-ulid==3.0.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
